<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Technosensor - Cadastro</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <div class="login-wrappper">

            <div class="login-contain">
                <div class="logo-marca cadastro">
                    <img src="assets/icone.png" alt="Logo da empresa TECHNOSENSOR">
                    <h1>TECHNOSENSOR</h1>
                    <p class="subtitulo">Crie sua conta</p>
                </div>

            <form id="form-cadastro">
                <input class="campo" type="text" id="nome" placeholder="Nome completo">
                <input class="campo" type="text" id="novo-usuario" placeholder="Usuário">
                <input class="campo" type="password" id="nova-senha" placeholder="Senha">
                <input class="campo" type="password" id="confirmar-senha" placeholder="Confirmar senha">
                <button type="submit">Cadastrar</button>
            </form>

            <footer class="cadastro-rodape">
                <p>Já tem uma conta? <a href="index.html">Entrar</a></p>
                <p class="empresa">TECHNOSENSOR, Manutenção Preditiva</p>
            </footer>

            </div>

            <script src="js/cadastro.js"></script>
        </div>
    </body>
</html>
