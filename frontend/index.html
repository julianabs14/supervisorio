<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Supervisório IGV - Login</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <div class="login-container">
            <div class="logo-marca">
                <img src="assets/icone.png" alt="Logo marca da empresa TECHNOSENSOR">
                <h1>TECHNOSENSOR</h1>
                <p class="subtitulo">Manutenção preditiva</p>
            </div>

            <form id="form-login">
                <input type="text" id="usuario" placeholder="Usuário">
                <input type="password" id="senha" placeholder="Senha">
                <button type="submit">Entrar</button>
            </form>

            <footer>
                <p>Não tem conta? <a href="cadastro.html" id="link-cadastro">Cadastre-se</a></p>
            </footer>
        </div>

        <script src="js/app.js"></script>

    </body>
</html>
